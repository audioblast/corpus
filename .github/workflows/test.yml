name: Test

# Syntax-checks the modules, the generator and the tests, then runs the tests.
# The tests use a fake audioBlast API, so no network access is needed.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check syntax
        run: |
          for f in js/*.js tools/*.mjs tests/*.js; do node --check "$f"; done

      - name: Test
        run: npm test
